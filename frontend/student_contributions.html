<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doubtout - My Contributions</title>
    <!-- Load Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font import and general base styles */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f8ff;
            /* Light blue background */
        }

        /* Custom scrollbar for contribution list */
        .contribution-list-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .contribution-list-scroll::-webkit-scrollbar-thumb {
            background: #93c5fd;
            /* Blue-300 */
            border-radius: 3px;
        }

        /* Custom ring color for focus states */
        .focus-ring-blue {
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
            /* blue-500 with transparency */
        }

        .sidebar {
            width: 280px;
            height: 100vh;
            padding-top: 1rem;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #1f2937;
            color: #e6f0ed;
            z-index: 20;
        }

        .sidebar a {
            text-decoration: none;
            color: #d1d5db;
            font-size: 1.125rem;
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            transition: background-color 0.2s, color 0.2s;
        }

        .sidebar a:hover {
            background-color: #374151;
            color: #2196f3;
        }

        .sidebar a.active {
            background-color: #2196f3;
            color: #1f2937;
            font-weight: 700;
            border-right: 4px solid #f97316;
        }

        .main-content {
            margin-left: 280px;
            width: calc(100% - 280px);
            min-height: 100vh;
            box-sizing: border-box;
            padding: 24px;
        }

        @media (max-width: 640px) {
            .sidebar {
                width: 220px;
            }

            .main-content {
                margin-left: 220px;
                width: calc(100% - 220px);
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Main Header (Dark theme with Blue Accent) -->
    <div id="student-sidebar"></div>

    <main class="main-content">
        <h1 class="text-4xl font-extrabold text-gray-800 text-center mb-4">
            My Contributions
        </h1>
        <p class="text-center text-gray-600 mb-8">
            Questions you've answered and successfully resolved for others.
        </p>

        <!-- Contribution Metrics -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Total Answers -->
            <div class="bg-white p-6 rounded-xl shadow-lg border-l-4 border-blue-500">
                <p class="text-sm font-medium text-gray-500">Total Answers Provided</p>
                <p id="total-answers" class="text-3xl font-bold text-gray-900 mt-1">0</p>
            </div>

            <!-- Voted Answers -->
            <div class="bg-white p-6 rounded-xl shadow-lg border-l-4 border-green-500">
                <p class="text-sm font-medium text-gray-500">Answers Accepted/Voted</p>
                <p id="accepted-answers" class="text-3xl font-bold text-gray-900 mt-1">0</p>
            </div>

            <!-- Average Rating (Mock) -->

        </div>

        <!-- Filter and List Container -->
        <div class="bg-white p-6 rounded-xl shadow-lg">

            <!-- Course Filter -->
            <div class="mb-4 flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800">Answered Questions</h2>

            </div>

            <!-- Contribution List -->
            <div id="contribution-list" class="space-y-4 max-h-[60vh] overflow-y-auto contribution-list-scroll">
                <!-- Contribution items will be dynamically injected here -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-16 text-gray-500">
                <svg class="mx-auto h-12 w-12" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2z" />
                </svg>
                <p class="mt-2 text-xl font-medium">You haven't contributed any answers yet.</p>
                <p class="text-sm">Join a <a href="practice_session.html" class="text-blue-600 hover:underline">Practice
                        Session</a> to start helping!</p>
            </div>
        </div>

    </main>


    <!-- JavaScript for Data Management and Rendering -->
    <script>
        const API_URL = 'http://localhost:3000/api';
        const user = JSON.parse(localStorage.getItem("doubtoutUser"));

        if (!user || user.role !== "student") {
            alert("Please login as a student");
            window.location.href = "login1.html";
        }

        const totalEl = document.getElementById("total-answers");
        const approvedEl = document.getElementById("accepted-answers");
        const listContainer = document.getElementById("contribution-list");
        const emptyState = document.getElementById("empty-state");
        const courseFilter = document.getElementById("course-filter");

        let approvedAnswersGlobal = [];
        let pendingCountGlobal = 0;

        document.addEventListener("DOMContentLoaded", loadContributions);
        courseFilter.addEventListener("change", applyFilter);

        /* ---------------- LOAD DATA ---------------- */
        async function loadContributions() {
            try {
                const res = await fetch(`${API_URL}/student/contributions/${user.user_id}`);
                const data = await res.json();

                pendingCountGlobal = data.pending_count || 0;
                approvedAnswersGlobal = data.approved_answers || [];

                // Metrics
                totalEl.textContent = pendingCountGlobal + approvedAnswersGlobal.length;
                approvedEl.textContent = approvedAnswersGlobal.length;

                renderList(approvedAnswersGlobal, pendingCountGlobal);

            } catch (err) {
                console.error("Failed to load contributions", err);
            }
        }

        /* ---------------- FILTER ---------------- */
        function applyFilter() {
            const selectedCourse = courseFilter.value;

            const filtered = approvedAnswersGlobal.filter(a =>
                !selectedCourse || a.course === selectedCourse
            );

            renderList(filtered, pendingCountGlobal);
        }

        /* ---------------- RENDER ---------------- */
        function renderList(approvedAnswers, pendingCount) {
            listContainer.innerHTML = "";
            emptyState.classList.add("hidden");

            // Pending summary
            if (pendingCount > 0) {
                const pendingCard = document.createElement("div");
                pendingCard.className =
                    "bg-yellow-50 p-4 rounded-lg border border-yellow-300";

                pendingCard.innerHTML = `
            <h3 class="font-semibold text-yellow-800">
                ${pendingCount} answer(s) awaiting professor approval
            </h3>
        `;
                listContainer.appendChild(pendingCard);
            }

            // Approved answers
            if (approvedAnswers.length === 0) {
                if (pendingCount === 0) {
                    emptyState.classList.remove("hidden");
                }
                return;
            }

            approvedAnswers.forEach(a => {
                const item = document.createElement("div");
                item.className =
                    "bg-white p-4 rounded-lg shadow-md border border-gray-200";

                item.innerHTML = `
            <h3 class="text-lg font-semibold text-gray-800">
                ${a.question || "Question unavailable"}
            </h3>

            <p class="text-sm text-gray-500 mt-1">
                <span class="text-blue-600 font-medium">
                    ${a.course || "Unknown course"}
                </span>
            </p>

            <div class="mt-3 bg-green-50 border border-green-300 rounded-lg p-3">
                <p class="text-sm font-medium text-green-800">
                    Approved by Prof. ${a.professor_name || "Faculty"}
                </p>
                <p class="mt-2 text-gray-800">
                    ${a.answer_text || ""}
                </p>
            </div>
        `;

                listContainer.appendChild(item);
            });
        }
    </script>
    <script src="js/student_layout.js"></script>
</body>

</html>
